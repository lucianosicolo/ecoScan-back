name: EcoScan Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile NestJS
        run: npm run build
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Run integration smoke tests
        run: npm run test:e2e -- --runInBand
